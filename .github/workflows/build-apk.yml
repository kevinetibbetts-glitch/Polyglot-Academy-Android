name: Build Polyglot Academy APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Polyglot_Academy_Android_5_4_Build_Ready.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract complete Android project
        shell: bash
        run: |
          set -euo pipefail
          test -s Polyglot_Academy_Android_5_4_Build_Ready.zip
          unzip -tq Polyglot_Academy_Android_5_4_Build_Ready.zip
          mkdir -p source-project
          unzip -q Polyglot_Academy_Android_5_4_Build_Ready.zip -d source-project
          cp -a source-project/app .
          cp source-project/settings.gradle source-project/build.gradle source-project/gradle.properties .
          test -s app/src/main/assets/index.html
          test -s app/src/main/java/com/polyglot/speakingacademy/MainActivity.java
          test -s app/src/main/AndroidManifest.xml

      - name: Apply tested Android 5.5 speaking controls
        run: python3 scripts/apply_voice_55.py

      - name: Keep existing 5.4 installation and progress untouched
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle")
          s = p.read_text()
          assert "applicationId 'com.polyglot.speakingacademy'" in s
          p.write_text(s.replace("applicationId 'com.polyglot.speakingacademy'", "applicationId 'com.polyglot.speakingacademy.voice'"))
          p = Path("app/src/main/AndroidManifest.xml")
          s = p.read_text()
          assert 'android:label="Polyglot Academy"' in s
          p.write_text(s.replace('android:label="Polyglot Academy"', 'android:label="Polyglot Academy 5.5"'))
          p = Path("app/src/main/assets/index.html")
          s = p.read_text()
          assert "Android 5.3 Test • four languages" in s
          p.write_text(s.replace("Android 5.3 Test • four languages", "Android 5.5 • Speak & Replay"))
          PY

      - name: Apply Android 5.6 voice repair
        run: python3 scripts/apply_audio_56.py

      - name: Validate Java audio search expression
        run: python3 scripts/repair_search_java_56.py

      - name: Verify phone audio repair assets
        shell: bash
        run: |
          grep -q 'id="phoneSoundCheck"' app/src/main/assets/index.html
          grep -q 'id="phoneVoiceCheck"' app/src/main/assets/index.html
          grep -q 'id="phoneVoiceSettings"' app/src/main/assets/index.html
          grep -q 'versionCode 56' app/build.gradle
          grep -q 'android.intent.action.TTS_SERVICE' app/src/main/AndroidManifest.xml
          grep -q 'initializeSpeechEngine' app/src/main/java/com/polyglot/speakingacademy/MainActivity.java

      - name: Validate speaking UI patch
        run: |
          grep -q 'id="voiceRecStart"' app/src/main/assets/index.html
          grep -q 'id="recStart"' app/src/main/assets/index.html
          grep -q "versionCode 56" app/build.gradle

      - name: Add beginner building blocks to all four languages
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/foundations_57.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/src/main/assets/index.html")
          html=p.read_text(encoding="utf-8")
          js=Path("assets/foundations_57.js").read_text(encoding="utf-8")
          assert "const FOUNDATION_UNITS=" in js and "foundationInstallUI();" in js
          assert "</body>" in html
          assert "Polyglot Academy 5.7" not in html
          html=html.replace("</body>","<script>\n"+js+"\n</script></body>",1)
          import re
          html,n=re.subn(r'(<span class="pill">)Android 5\.[^<]*(</span>)',r'\g<1>Android 5.7 • Beginner Foundations\g<2>',html,count=1)
          assert n==1, "Could not update the Android header version"
          p.write_text(html,encoding="utf-8")
          gradle=Path("app/build.gradle")
          g=gradle.read_text()
          assert "versionCode 56" in g
          assert "applicationId 'com.polyglot.speakingacademy.voice'" in g
          g=g.replace("applicationId 'com.polyglot.speakingacademy.voice'","applicationId 'com.polyglot.speakingacademy.foundations'")
          g=g.replace("versionCode 56","versionCode 57").replace("versionName '5.6-android'","versionName '5.7-android'")
          gradle.write_text(g)
          manifest=Path("app/src/main/AndroidManifest.xml")
          m=manifest.read_text()
          m=m.replace('android:label="Polyglot Academy 5.5"','android:label="Polyglot Academy 5.7"')
          manifest.write_text(m)
          PY

      - name: Validate foundation lessons and progress
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode 57' app/build.gradle
          grep -q 'Android 5.7 • Beginner Foundations' app/src/main/assets/index.html
          grep -q 'const FOUNDATION_UNITS=' app/src/main/assets/index.html
          grep -q 'foundationHomeGo' app/src/main/assets/index.html
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const js=fs.readFileSync('assets/foundations_57.js','utf8');
          const start=js.indexOf('const FOUNDATION_UNITS='), end=js.indexOf('const foundationCounts=');
          if(start<0||end<=start)throw Error('Foundations missing');
          const ctx={};vm.runInNewContext(js.slice(start,end)+'\nthis.data=FOUNDATION_UNITS;',ctx);
          let total=0;
          for(const [lang,minUnits] of [['ceb',5],['ko',6],['zh',6],['ja',6]]){
            const units=ctx.data[lang];if(units.length!==minUnits)throw Error(lang+' unit count');
            for(const unit of units){
              const forms=new Set();
              if(unit.items.length<8)throw Error('Too few items in '+lang+' '+unit.id);
              for(const card of unit.items){
                if(card.length<6||!card[0]||!card[2]||!card[5])throw Error('Invalid card '+lang+' '+unit.id);
                if(forms.has(card[0]))throw Error('Duplicate quiz option '+lang+' '+unit.id+': '+card[0]);
                forms.add(card[0]);total++;
              }
            }
            console.log(lang,units.length,'foundation chapters');
          }
          if(total<240)throw Error('Foundation deck unexpectedly short');
          console.log('Validated '+total+' foundation cards');
          NODE

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android API 35 using runner SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          echo "SDK manager: $SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
          ls -la "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms/android-35"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile Android APK
        run: gradle --no-daemon --console=plain assembleDebug

      - name: Verify APK exists
        shell: bash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk PolyglotAcademy.apk
          ls -lh PolyglotAcademy.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PolyglotAcademy-Android-APK
          path: PolyglotAcademy.apk
          if-no-files-found: error
          retention-days: 30
