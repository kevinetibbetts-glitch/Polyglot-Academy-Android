name: Build Polyglot Academy APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Extract complete app package
        shell: bash
        run: |
          set -euo pipefail
          if [ -f app/src/main/assets/index.html ]; then
            echo "Using unpacked Android project."
          else
            file=$(find . -maxdepth 2 -type f -iname 'Polyglot_Academy_Android_5_4_Build_Ready.zip' -print -quit)
            if [ -z "$file" ]; then
              echo "::error::Upload Polyglot_Academy_Android_5_4_Build_Ready.zip to the repository first."
              exit 1
            fi
            unzip -oq "$file" -d .
          fi
          test -f app/build.gradle
          test -f app/src/main/java/com/polyglot/speakingacademy/MainActivity.java
          test -f app/src/main/assets/index.html
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile Android APK
        run: gradle --no-daemon --console=plain assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PolyglotAcademy-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
